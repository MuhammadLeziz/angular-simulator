@if (isLoading) {
  <div class="loading-wrapper">
    <img
      src="/icons/app/loading.svg"
      alt=""
      width="51"
      height="51"
      class="loading-arrow"
    />
  </div>
} @else {
  <app-loader-component></app-loader-component>
  @if (router.url !== '/login') {
    <app-header></app-header>
  }
  <router-outlet></router-outlet>
  @if (router.url !== '/login') {
    <app-footer></app-footer>
  }
  <app-message></app-message>
}
