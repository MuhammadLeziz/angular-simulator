@if (isLoading) {
  <div class="loading-wrapper">
    <img
      src="/icons/app/loading.svg"
      alt=""
      width="51"
      height="51"
      class="loading-arrow"
    />
  </div>
} @else {
  <app-loader-component />
  @if (router.url !== '/login') {
    <app-header />
  }
  <router-outlet />
  @if (router.url !== '/login') {
    <app-footer />
  }
  <app-message />
}
