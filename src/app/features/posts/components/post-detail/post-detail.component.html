<div class="flex justify-center">
  <p-card
    class="max-w-sm w-full"
    [header]="post.title"
    subheader="{{ post.tags }}"
  >
    <p class="m-0">{{ post.body }}</p>
    <ng-template #footer>
      <span class="text-sm text-surface-500 dark:text-surface-400"
        >{{ post.reactions.likes }} <fa-icon [icon]="faThumbsUp" /> </span
      ><br />
      <span class="text-sm text-surface-500 dark:text-surface-400"
        >{{ post.reactions.dislikes }} <fa-icon [icon]="faThumbsDown" /> </span
      ><br />
      <span class="text-sm text-surface-500 dark:text-surface-400"
        >{{ post.views }} <fa-icon [icon]="faEye"
      /></span>
      <br />
      <span class="text-sm text-surface-500 dark:text-surface-400">{{
        post.userId
      }}</span>
      <br />
      <app-button [routerLink]="['/posts']">Назад к таблице</app-button>
    </ng-template>
  </p-card>
</div>
