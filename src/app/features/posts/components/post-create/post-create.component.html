<div class="flex justify-center p-6">
  <div
    class="w-full max-w-lg p-6 bg-surface-0 dark:bg-surface-900 border border-surface-200 dark:border-surface-700 rounded-xl shadow-sm">
    <h2 class="text-2xl font-bold mb-6">Создать новый пост</h2>
    <form [formGroup]="formCreatePost" (ngSubmit)="onSubmit()" class="flex flex-col gap-4">
      <div class="flex flex-col gap-2">
        <label for="title" class="font-bold">Заголовок</label>
        <input pInputText id="title" formControlName="title" placeholder="Введите заголовок поста" class="w-full" />
      </div>
      <div class="flex flex-col gap-2">
        <label for="body" class="font-bold">Текст поста</label>
        <textarea pTextarea id="body" formControlName="body" rows="5" placeholder="Введите текст поста..."
          class="w-full"></textarea>
      </div>
      <div class="flex flex-col gap-2">
        <label for="tags" class="font-bold">Теги (через запятую)</label>
        <input pInputText id="tags" formControlName="tags" placeholder="например: tech, news, angular" class="w-full" />
      </div>
      <div class="flex flex-col gap-2">
        <label for="userId" class="font-bold">ID Автора (UserId)</label>
        <input pInputText id="userId" type="number" formControlName="userId" placeholder="например: 5" class="w-full" />
      </div>
      <div class="flex justify-end gap-3 mt-4">
        <button pButton type="button" label="Отмена" severity="secondary" [routerLink]="['/posts']"></button>
        <button pButton type="submit" label="Создать пост" severity="primary"></button>
      </div>
    </form>
  </div>
</div>
