<section class="users">
  <div class="text-center text-success">
    {{ usersCount | plural: 'пользователь' : 'пользователя' : 'пользователей' }}
  </div>
  <div class="users__inner container">
    <h1 class="users__title">Список Пользователей</h1>
    <app-usersfilter (filteredString)="filterCards($event)" />
    @if (filteredUsers$ | async; as users) {
      @if (users.length) {
        <div class="users__list">
          @for (user of users; track user.id) {
            <app-user-card [user]="user" (id)="deleteCard($event)" />
          }
        </div>
      } @else {
        <div class="users__empty">Нет пользователей для отображения</div>
      }
    }
  </div>
</section>
<app-user-create (userCreated)="addUser($event)" />
