<section class="users">
  <div class="users__inner container">
    <h1 class="users__title">Список Пользователей</h1>
    <app-usersfilter (filteredString)="filterCards($event)"></app-usersfilter>
    @if (filteredUsers$ | async; as users) {
    @if (users.length) {
    <div class="users__list">
      @for (user of users; track user.id) {
      <app-user-card [user]="user" (id)="deleteCard($event)"></app-user-card>
      }
    </div>
    } @else {
    <div class="users__empty">
      Нет пользователей для отображения
    </div>
    }
    }
  </div>
</section>
<app-user-create (userCreated)="addUser($event)"></app-user-create>
